[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriptforge"
version = "0.1.0"
description = "Reproducible human transcriptomics analysis platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "PolyForm-Noncommercial-1.0.0" }
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "boto3>=1.34,<2",
  "celery[redis]>=5.4,<6",
  "fastapi>=0.115,<1",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
  "umap-learn>=0.5.7,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["apps/api", "analysis/python"]
include = ["transcriptforge_api*", "transcriptforge_analysis*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["apps/api/tests", "analysis/python/tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"apps/api/alembic/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
