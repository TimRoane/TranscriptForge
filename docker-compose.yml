name: transcriptforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transcriptforge}
      POSTGRES_USER: ${POSTGRES_USER:-transcriptforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcriptforge}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-transcriptforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-transcriptforge-dev-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/transcriptforge
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-transcriptforge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-transcriptforge-dev-only}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/apps/api:/app/analysis/python
      TRANSCRIPTFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transcriptforge}:${POSTGRES_PASSWORD:-transcriptforge}@postgres:5432/${POSTGRES_DB:-transcriptforge}
      TRANSCRIPTFORGE_CELERY_BROKER_URL: redis://redis:6379/0
      TRANSCRIPTFORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
      TRANSCRIPTFORGE_LOCAL_STORAGE_ROOT: /data/transcriptforge
      TRANSCRIPTFORGE_RUN_WORK_ROOT: /data/transcriptforge/runtime
    command:
      - /bin/sh
      - -c
      - alembic -c apps/api/alembic.ini upgrade head && uvicorn transcriptforge_api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./analysis/python:/app/analysis/python:ro
      - ./microarray:/app/microarray:ro
      - ./references:/app/references:ro
      - ./schemas:/app/schemas:ro
      - run-data:/data/transcriptforge

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      PYTHONPATH: /app/apps/api:/app/analysis/python
      TRANSCRIPTFORGE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-transcriptforge}:${POSTGRES_PASSWORD:-transcriptforge}@postgres:5432/${POSTGRES_DB:-transcriptforge}
      TRANSCRIPTFORGE_CELERY_BROKER_URL: redis://redis:6379/0
      TRANSCRIPTFORGE_CELERY_RESULT_BACKEND: redis://redis:6379/1
      TRANSCRIPTFORGE_LOCAL_STORAGE_ROOT: /data/transcriptforge
      TRANSCRIPTFORGE_RUN_WORK_ROOT: /data/transcriptforge/runtime
      TRANSCRIPTFORGE_REFERENCE_CACHE_ROOT: /data/transcriptforge/reference-cache
      TRANSCRIPTFORGE_PIPELINE_PATH: /app/pipelines/main.nf
      TRANSCRIPTFORGE_NEXTFLOW_PROFILE: ${TRANSCRIPTFORGE_NEXTFLOW_PROFILE:-test}
    command: ["celery", "-A", "transcriptforge_api.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app/apps/api
      - ./analysis/python:/app/analysis/python:ro
      - ./analysis/r:/app/analysis/r:ro
      - ./pipelines:/app/pipelines:ro
      - ./microarray:/app/microarray:ro
      - ./references:/app/references:ro
      - ./schemas:/app/schemas:ro
      - run-data:/data/transcriptforge

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    command: ["npm", "--workspace", "@transcriptforge/web", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app/apps/web
      - web-node-modules:/app/node_modules

volumes:
  minio-data:
  postgres-data:
  redis-data:
  run-data:
  web-node-modules:
