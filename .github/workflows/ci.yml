name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m ruff check apps/api
      - run: python -m mypy apps/api/transcriptforge_api analysis/python/transcriptforge_analysis
      - run: python -m pytest apps/api/tests analysis/python/tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --workspace @transcriptforge/web run lint
      - run: npm --workspace @transcriptforge/web test -- --run
      - run: npm --workspace @transcriptforge/web run build

  nextflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '25.04.8'
      - run: nextflow run pipelines/main.nf -entry RUN_DEMO -profile test --outdir .nextflow-test-results
      - run: nextflow run pipelines/main.nf -entry PREPARE_DATASET -profile test --validation_config demo/configs/count_matrix_validation.json --matrix demo/data/counts.tsv --metadata demo/metadata/sample_metadata.tsv --outdir .nextflow-test-results

  r-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build worker
      - run: >-
          docker compose run --rm --no-deps worker
          Rscript /app/analysis/r/tests/run_differential_expression_acceptance.R
      - run: >-
          docker compose run --rm --no-deps worker
          Rscript /app/analysis/r/tests/run_signature_scoring_acceptance.R
      - run: >-
          docker compose run --rm --no-deps worker
          Rscript /app/analysis/r/tests/run_deconvolution_acceptance.R
      - run: >-
          docker compose run --rm --no-deps worker
          Rscript /app/analysis/r/tests/run_deconvolution_enrichment_acceptance.R

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api web

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "${{ github.workspace }}/infra/aws/terraform:/workspace"
          -w /workspace hashicorp/terraform:1.13 fmt -check
      - run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "${{ github.workspace }}/infra/aws/terraform:/workspace"
          -w /workspace hashicorp/terraform:1.13 init -backend=false -input=false
      - run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          -v "${{ github.workspace }}/infra/aws/terraform:/workspace"
          -w /workspace hashicorp/terraform:1.13 validate
